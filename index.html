<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaheer Medical Complex — View Your Report</title>
<link rel="manifest" href="manifest-patient.json">
<meta name="theme-color" content="#12313B">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7F6; --surface:#fff; --ink:#16302E; --header:#12313B;
    --accent:#0E7C86; --accent-soft:#EAF4F2; --border:#DDE5E3;
    --muted:#5B6B6E; --muted2:#8FA3A1;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);}

  header{background:var(--header); padding:18px 20px; display:flex; align-items:center; gap:12px;}
  .brand-icon{width:40px; height:40px; border-radius:10px; background:#fff; padding:3px; display:flex; align-items:center; justify-content:center;}
  .brand-icon img{width:100%; height:100%; object-fit:contain;}
  .brand-name{font-weight:700; font-size:16px; color:#fff;}
  .brand-sub{font-size:11px; color:#9FC3C4;}

  main{padding:20px; max-width:700px; margin:0 auto;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px; text-align:center;}
  .card h2{font-family:'Space Grotesk',sans-serif; font-size:19px; margin:0 0 6px;}
  .card p{font-size:13px; color:var(--muted); margin:0 0 18px;}
  #mrInput{width:100%; max-width:280px; padding:13px; font-size:18px; text-align:center; letter-spacing:2px; border:1px solid var(--border); border-radius:10px; margin-bottom:12px; font-family:'IBM Plex Mono',monospace;}
  .btn{padding:12px 22px; border-radius:9px; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif;}
  .btn:disabled{background:#CBD8D6; cursor:not-allowed;}
  #msg{margin-top:14px; font-size:13px; font-weight:600; min-height:16px;}
  #msg.err{color:#B4590E;}
  #msg.ok{color:#2F7D5D;}

  .report-wrap{background:#fff; border:1px solid var(--border); border-radius:12px; padding:18px; margin-top:18px;}
  .report-actions{display:flex; justify-content:flex-end; gap:8px; margin-bottom:10px;}
  .btn-outline{background:#fff; border:1px solid var(--border); color:var(--header); padding:9px 14px; border-radius:8px; font-weight:600; font-size:12.5px; cursor:pointer; font-family:'Inter',sans-serif;}

  /* ---- Report styles (matches printed report) ---- */
  .rpt-slide{position:relative; padding:2px; margin-bottom:26px; background:#fff;}
  .rpt-header{text-align:center; margin-bottom:14px;}
  .rpt-en{font-size:22px; font-weight:700; letter-spacing:0.3px; color:#000; text-decoration:underline; text-underline-offset:4px;}
  .rpt-addr{font-size:13px; color:#000; margin-top:4px;}
  table.rpt-hdrtable{width:100%; border-collapse:collapse; border:1px solid #000; margin-bottom:16px; font-size:12.5px;}
  table.rpt-hdrtable td{border:1px solid #000; padding:6px 9px; vertical-align:middle;}
  table.rpt-hdrtable td.lbl{font-weight:400; color:#000; width:14%;}
  table.rpt-hdrtable td.val{font-weight:700;}
  table.rpt-hdrtable td.cattitle{text-align:center; font-weight:700; font-size:15px; text-decoration:underline; text-underline-offset:3px; padding:8px;}
  table.rpt-results{width:100%; border-collapse:collapse; font-size:12.5px; border:1px solid #000;}
  table.rpt-results th{text-align:left; padding:8px 9px; background:#bfbfbf; border:1px solid #000; font-size:12.5px; font-weight:700; text-transform:uppercase;}
  table.rpt-results th:nth-child(2), table.rpt-results th:nth-child(3){text-align:center;}
  table.rpt-results td{padding:7px 9px; border:1px solid #000;}
  table.rpt-results td:nth-child(2), table.rpt-results td:nth-child(3){text-align:center;}
  .rpt-cat-title{font-weight:700; background:#bfbfbf; text-transform:uppercase;}
  .rpt-sec-title{font-weight:700; font-style:italic; color:#000;}
  .rpt-sig{margin-top:48px; display:flex; justify-content:space-between; gap:24px;}
  .rpt-sig div{border-top:1px solid #000; padding-top:6px; width:180px; font-size:11.5px; text-align:center; color:#000;}
  .rpt-comments{margin-top:16px; padding:10px 12px; border:1px solid #000; font-size:11.5px; color:#000; white-space:pre-line; line-height:1.6;}
  .rpt-pagebreak{page-break-after:always;}
  .rpt-footer{margin-top:22px;}
  .rpt-disclaimer{font-size:10.5px; color:#333; text-align:center; margin-top:10px;}

  @media print{
    header, .card, .report-actions{display:none !important;}
    body{background:#fff;}
    @page{ size: portrait; margin: 12mm; }
  }
</style>
</head>

  <div>
    <div class="brand-name">ZAHEER MEDICAL COMPLEX LAB</div>
    <div class="brand-sub">View Your Report Online</div>
  </div>
</header>

<main>
  <div class="card">
    <h2>Enter Your MR Number</h2>
    <p>Enter the MR number you were given to view your lab report.</p>
    <input id="mrInput" placeholder="e.g. 1024" autocomplete="off">
    <br>
    <button class="btn" id="lookupBtn" onclick="lookupReport()">View Report</button>
    <div id="msg"></div>
  </div>

  <div id="reportArea"></div>
</main>

<!-- Firebase (same project as the main lab system) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/*
  SETUP (one-time):
  1. Use the SAME Firebase project/config as zaheer-medical-complex-lis.html (copy the FIREBASE_CONFIG
     values from that file into the object below).
  2. In Firebase Console > Firestore Database > Rules, paste this and click Publish:

     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /reports/{mrNo} {
           allow get: if true;    // patient can fetch a SINGLE report if they know the exact MR number
           allow list: if false;  // nobody can browse/list all reports
           allow write: if true;  // simplified for a small clinic (see note below)
         }
       }
     }

     Note: "allow write: if true" means anyone with your Firebase config could technically write
     data. For a small clinic where only trusted staff use the system this is a reasonable
     trade-off; if you want it locked down further later, we can add Firebase Authentication
     for staff logins (still free) so only signed-in staff can write.

  3. Host this file + zaheer-medical-complex-lis.html on GitHub Pages (or anywhere free), and share this
     page's link with patients (e.g. via WhatsApp after their test).
*/
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDfmZdnegdYImNhvOI2SeZrjVbNadkuV1A",
  authDomain: "hospital-lab-system-572c3.firebaseapp.com",
  projectId: "hospital-lab-system-572c3",
  storageBucket: "hospital-lab-system-572c3.firebasestorage.app",
  messagingSenderId: "653303854003",
  appId: "1:653303854003:web:fa4e38103b1ff11d2f11c6"
};
let db = null;
try{
  if(FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY"){
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  }
}catch(e){ console.error("Firebase init failed:", e); }

function setMsg(text, cls){
  const el = document.getElementById("msg");
  el.textContent = text || "";
  el.className = cls || "";
}

async function lookupReport(){
  const mr = document.getElementById("mrInput").value.trim();
  const btn = document.getElementById("lookupBtn");
  document.getElementById("reportArea").innerHTML = "";
  setMsg("", "");

  if(!mr){ setMsg("Please enter an MR number first.", "err"); return; }
  if(!db){ setMsg("System is still being set up, please try again shortly.", "err"); return; }

  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = "Searching...";

  try{
    const doc = await db.collection("reports").doc(mr).get();
    if(!doc.exists){
      setMsg("No report found for this MR number. Please double-check the number.", "err");
    } else {
      const data = doc.data();
      if(data.status !== "completed"){
        setMsg("Your report is still being prepared. Please check again shortly.", "err");
      } else {
        setMsg("Report found ✓", "ok");
        document.getElementById("reportArea").innerHTML = `
          <div class="report-wrap">
            <div class="report-actions">
              <button class="btn-outline" onclick="window.print()">🖶 Print / Save PDF</button>
            </div>
            ${data.html}
          </div>`;
      }
    }
  }catch(e){
    console.error(e);
    setMsg("Something went wrong. Please check your internet connection and try again.", "err");
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

document.getElementById("mrInput").addEventListener("keydown", e=>{ if(e.key==="Enter") lookupReport(); });

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
  });
}
</script>
</body>
</html>
